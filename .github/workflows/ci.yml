name: Contract CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck, tests and production build
        run: npm run check

  browser-visual-qa:
    name: browser-visual-qa
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium for real rendering
        run: npx playwright install --with-deps chromium
      - name: Screenshot and mobile layout checks
        run: npm run test:visual
      - name: Upload mobile screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p6-1-browser-screenshots
          path: |
            test-results/p6-visual/**
            test-results/**/*.zip
            playwright-report/**
          retention-days: 14
          if-no-files-found: warn

  acoustic-calibration-qa:
    name: acoustic-calibration-qa
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate and validate reproducible Prius/Aura synthetic WAV
        run: npm run audio:qa
      - name: Upload original synthetic WAV and spectral diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-e-acoustic-audition
          path: test-results/p5e-audio/**
          retention-days: 14
          if-no-files-found: warn
